# docker-compose.prod.yml — for testing the production image

version: '3.7' # version 3.7 matches current umbrelOS app-store requirement

# Same network subnet as umbrelOS apps
networks:
  devnet:
    driver: bridge
    ipam:
      config:
        - subnet: 10.21.0.0/16

services:
  # The pool itself. The webui never spawns this; it only reads its API and logs.
  pogolo:
    image: 0xf0xx0/pogolo:v1.1.4-hotfix@sha256:0fb1d4696d4456ad4d5f44dae8f75fe959ea1200aac5af88ceefe289f7dfba4a
    container_name: pogolo
    restart: on-failure
    volumes:
      - ./data:/data # config.toml, shared with the app
    ports:
      - '127.0.0.1:5661:5661' # stratum, for miners
    networks:
      devnet:
        ipv4_address: 10.21.21.9

  app:
    image: pogolo-webui:prod
    user: '1000:1000'
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./data:/data # pogolo config dir + log file
    environment:
      # POGOLO SETTINGS
      POGOLO_API_URL: http://10.21.21.9:5662 # pogolo's HTTP API
      POGOLO_LOG: /data/pogolo.log # log file we tail for the live log stream
      POGOLO_DIR: /data # where config.toml lives
      STRATUM_PORT: 5661 # shown in the connect modal

      # CONNECTION DETAILS (shown to user in the connect modal)
      DEVICE_DOMAIN_NAME: 127.0.0.1
    networks:
      devnet:
        ipv4_address: 10.21.21.8 # matches existing APP_BITCOIN_NODE_IP on umbrelOS app store
